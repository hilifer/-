# ============================================================
# 电费自动化项目 - 配置文件
# ============================================================

# --- 邮箱配置 ---
email:
  imap_server: "imap.qq.com"
  imap_port: 993
  username: "your_email@qq.com"        # QQ 邮箱账号
  auth_code: "your_auth_code_here"     # QQ 邮箱授权码（非登录密码）
  use_ssl: true

# --- 邮件筛选规则 ---
email_filter:
  # 发件人或主题中包含以下关键词
  subject_keywords:
    - "电费"
  sender_keywords:
    - "电费"
  # 收件人中包含以下关键词
  recipient_keywords:
    - "曹先生"
  # 仅抓取此日期之后的邮件（格式: YYYY-MM-DD），留空则不限
  since_date: ""

# --- 附件下载与归档目录 ---
storage:
  base_dir: "./data"                   # 根目录
  attachments_dir: "./data/attachments"  # 原始附件
  parsed_dir: "./data/parsed"          # 解析后的结构化数据
  db_path: "./data/electricity.db"     # SQLite 数据库路径
  csv_export_dir: "./data/csv_export"  # CSV 导出目录

# --- 字段映射配置（人工可改） ---
# 不同附件中的列名可能不同，在此映射为统一字段名
field_mapping:
  # 电表号可能的列名
  meter_number:
    - "电表号"
    - "上网表号"
    - "发电表号"
    - "表号"
    - "电能表号"
  # 资产编号可能的列名
  asset_number:
    - "资产编号"
    - "资产号"
    - "设备编号"
  # 用户编号可能的列名
  user_id:
    - "用户编号"
    - "用户号"
    - "户号"
    - "客户编号"
  # 倍率可能的列名
  multiplier:
    - "倍率"
    - "CT倍率"
    - "变比"
  # 项目名可能的列名
  project_name:
    - "项目"
    - "项目名称"
    - "电站名称"
    - "项目名"
  # 抄表日期可能的列名
  reading_date:
    - "抄表日期"
    - "抄表时间"
    - "读表日期"
    - "日期"
  # 尖峰
  peak_sharp:
    - "尖峰"
    - "尖"
  # 峰
  peak:
    - "峰"
  # 平
  flat:
    - "平"
  # 谷
  valley:
    - "谷"
  # 总电量
  total_kwh:
    - "总电量"
    - "总"
    - "合计"
    - "电量"

# --- 电表类型判定规则（人工可改） ---
meter_type_rules:
  # 上网表的判定关键词
  grid_feed:
    keywords:
      - "上网"
      - "反向"
      - "售电"
    # 数据方向: 反向（上网表）
    data_direction: "反向"
    reading_fields:
      - "反向尖峰"
      - "反向峰"
      - "反向平"
      - "反向谷"
  # 发电表的判定关键词
  generation:
    keywords:
      - "发电"
      - "正向"
      - "发电量"
    data_direction: "正向"
    reading_fields:
      - "正向尖"
      - "正向峰"
      - "正向平"
      - "正向谷"

# --- 图片 OCR 配置（人工可改） ---
ocr:
  # OCR 引擎: tesseract 或 paddleocr
  engine: "tesseract"
  # tesseract 语言包
  tesseract_lang: "chi_sim+eng"
  # 单价提取的正则表达式（用于从 OCR 文本中提取价格）
  price_patterns:
    - '尖[峰]?\s*[:：]?\s*(\d+\.?\d*)\s*元'
    - '峰\s*[:：]?\s*(\d+\.?\d*)\s*元'
    - '平\s*[:：]?\s*(\d+\.?\d*)\s*元'
    - '谷\s*[:：]?\s*(\d+\.?\d*)\s*元'
    - '单价\s*[:：]?\s*(\d+\.?\d*)'
  # 用户编号提取的正则表达式
  user_id_patterns:
    - '用户编号\s*[:：]?\s*(\d+)'
    - '户号\s*[:：]?\s*(\d+)'
    - '客户编号\s*[:：]?\s*(\d+)'

# --- 可视化配置 ---
visualization:
  # 默认图表类型
  default_chart: "line"
  # 图表输出目录
  output_dir: "./data/charts"
  # 折线图颜色方案
  line_colors:
    - "#1f77b4"
    - "#ff7f0e"
    - "#2ca02c"
    - "#d62728"
  # 中文字体（确保系统已安装）
  font_family: "SimHei"
